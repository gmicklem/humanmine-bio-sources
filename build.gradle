// HumanMine bio sources, on the InterMine 6.0 line: Gradle 8.14, JDK 17 (JDK 8 also works), maven-publish.
// See README.md for how to build against a local InterMine build.

buildscript {
    repositories {
        // the InterMine plugin: a local build (publishToMavenLocal in InterMine's plugin/, or -Dmaven.repo.local=<dir>) or Maven Central
        mavenLocal()
        mavenCentral()
    }
    // the version catalog (libs) is not available in buildscript {}: the plugin version comes from the imVersion system
    // property (gradle.properties), as in the InterMine builds
    dependencies {
        classpath group: 'org.intermine', name: 'plugin', version: System.getProperty("imVersion")
    }
}

ext {
    // set here to make available to individual bio-sources
    bioVersion = System.getProperty("bioVersion")
    imVersion = System.getProperty("imVersion")
}

subprojects {
    group = 'org.intermine'
    version = '4.3.0'

    apply plugin: 'java-library'
    apply plugin: 'dbmodel'
    apply plugin: 'biosource-dbmodel'
    apply plugin: 'checkstyle'

    // Java 8 bytecode whatever the build JDK; --release 8 and the test JVM options on JDK 9+
    apply from: "${rootDir}/config/gradle/java-target.gradle"

    repositories {
        // InterMine artifacts built locally (honours -Dmaven.repo.local), then Maven Central
        mavenLocal()
        mavenCentral()
    }

    configurations {
        bioModel
        mergeModel

        all {
            // InterMine 6.0 logs through reload4j (org.apache.log4j.Logger); the old build also put log4j 2.17.1 on the classpath
            exclude group: 'org.apache.logging.log4j'
        }
    }

    dependencies {
        // The types in the converters' constructors and protected methods (ItemWriter, Model, ObjectStore, BioFileConverter) are
        // api, so that a project that extends a converter compiles. A bio source is not a library for compile-time use, though:
        // a mine's webapp compiles against the generated model, not against these jars, and the plugin only puts them on a
        // runtime classpath. Libraries used only inside method bodies are implementation (POM scope runtime), as in
        // InterMine's bio/sources/build.gradle.
        api group: 'org.intermine', name: 'bio-core', version: bioVersion, transitive: false
        api group: 'org.intermine', name: 'intermine-integrate', version: imVersion, transitive: false
        api group: 'org.intermine', name: 'intermine-objectstore', version: imVersion, transitive: false
        api group: 'org.intermine', name: 'intermine-model', version: imVersion, transitive: false
        api libs.reload4j
        // org.apache.commons.lang3.StringUtils (the converters). bio-core is taken with transitive: false, so it is declared here
        // (bio-core's own POM has it as api). commons-lang 2 is no longer on any classpath of these sources.
        implementation libs.commons.lang3

        // Needed at run time by the plugin's Ant tasks (generateModel, buildUnitTestDB: they run on the project's runtime
        // classpath) and by the unit tests, not to compile: runtimeOnly, so POM scope runtime, as in InterMine's POMs
        runtimeOnly group: 'org.intermine', name: 'intermine-resources', version: imVersion, transitive: false // property files only
        runtimeOnly(libs.hikaricp) { transitive = false }
        runtimeOnly libs.commons.collections // torque
        runtimeOnly libs.commons.io
        runtimeOnly libs.commons.logging
        runtimeOnly libs.postgresql
        runtimeOnly libs.slf4j.reload4j

        testImplementation libs.junit
        testImplementation group: 'org.intermine', name: 'intermine-integrate', version: imVersion, classifier: 'testClasses'
        testImplementation libs.xmlunit

        mergeModel libs.reload4j
        mergeModel libs.slf4j.reload4j
        mergeModel group: 'org.intermine', name: 'intermine-objectstore', version: imVersion
        mergeModel group: 'org.intermine', name: 'intermine-model', version: imVersion
        mergeModel libs.commons.lang3
        bioModel group: 'org.intermine', name: 'bio-model', version: bioVersion, transitive: false
    }

    dbModelConfig {
        objectStoreName = "os.bio-test"
        modelName = "genomic"
        defaultInterminePropertiesFile = "default.intermine.bio-test.properties"
    }

    // The test mine's intermine.properties reaches the resources output through processResources, so every reader of that
    // directory (the tests, the plugin's tasks, which name copyMineProperties as the producer) sees who wrote it.
    // The jar does not carry it.
    task copyMineProperties(type: Copy) {
        from "${System.env.HOME}/.intermine/intermine-bio-test.properties"
        into layout.buildDirectory.dir('im/mine-properties')
        rename { fileName -> fileName.replace('intermine-bio-test.properties', 'intermine.properties') }
    }

    processResources {
        from copyMineProperties
    }

    jar {
        exclude "intermine.properties"
    }

    checkstyle {
        toolVersion = libs.versions.checkstyle.get()
        configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
        sourceSets = [sourceSets.main]
        showViolations = true
        ignoreFailures = false
        maxWarnings = 0
        configProperties = [
                'checkstyle.header.file': "${rootDir}/config/checkstyle/copyright_header.txt",
                'suppressionFile': "${rootDir}/config/checkstyle/suppressions.xml"
        ]
    }

    checkstyleMain {
        source = fileTree('src/main') {
            includes = ['**/*.java']
            excludes = ['build/**']
        }
    }

    checkstyleTest {
        enabled = false
    }

    tasks.withType(Test) {
        scanForTestClasses = false
        include '**/*Test.class'
    }

    test {
        ignoreFailures = false
        forkEvery = 1
    }

    // Publishing (maven-publish, signing, sources and javadoc jars, `install` alias, Central bundle): see README.md
    ext.imPublicationDescription = 'InterMine HumanMine bio sources'
    ext.imPublicationRepo = 'humanmine-bio-sources'
    apply from: "${rootDir}/config/gradle/publishing.gradle"
}

// `centralBundle`: zip of all signed publications for the Maven Central Portal (README.md)
apply from: "${rootDir}/config/gradle/central-bundle.gradle"

task testReport(type: TestReport) {
    destinationDirectory = layout.buildDirectory.dir('reports/allTests')
    // Include the results from the `test` task in all subprojects (flatMap keeps the task dependency)
    testResults.from(subprojects.collect { sub -> sub.tasks.named('test', Test).flatMap { it.binaryResultsDirectory } })
}
