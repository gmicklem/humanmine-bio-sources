// Java version settings, as in InterMine's config/gradle/java-target.gradle (applied after the java-library plugin).
//
// The JDK that runs Gradle (JAVA_HOME) compiles and runs the tests. Supported: JDK 17 (InterMine's CI), 21 and 8 (until 6.0.0 is
// released). No toolchain is declared. Whatever the build JDK, the artefacts are Java 8 bytecode (class file version 52), so a mine
// can keep a JDK 8 Tomcat.
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

if (JavaVersion.current().isJava9Compatible()) {
    // --release 8 also compiles against the Java 8 API: a call to a 9+ method fails here rather than with NoSuchMethodError on a
    // JDK 8 Tomcat. (javac 8 has no --release, and on JDK 8 sourceCompatibility already means the Java 8 API.)
    tasks.withType(JavaCompile).configureEach {
        options.release = 8
    }

    // cglib 3.1 (org.intermine.util.DynamicBean) defines its generated classes by calling ClassLoader.defineClass through
    // reflection, which JDK 16+ refuses unless java.base opens java.lang; Gradle's test workers do not pass it.
    tasks.withType(Test).configureEach {
        jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
    }
}
