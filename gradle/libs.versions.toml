# Version catalog of this build, loaded by Gradle as `libs`. The versions are those of InterMine's own catalog
# (gradle/libs.versions.toml on the maint-2026 branch of https://github.com/intermine/intermine), so that a mine's war
# carries one copy of each library. Not usable inside `buildscript { }` blocks.

[versions]
# 9.3: the last Checkstyle release that runs on Java 8 (10.x needs Java 11)
checkstyle = "9.3"
commons-collections = "3.2.2"
# the plugin's Ant tasks need it at run time (FileUtils in the objectstore)
commons-io = "2.22.0"
# StringUtils in the converters; also needed at run time by the plugin's Ant tasks (generateModel)
commons-lang3 = "3.21.0"
# no imports; the plugin's Ant tasks and the unit tests need it at run time (torque)
commons-logging = "1.3.5"
hikaricp = "4.0.3"
json = "20260814"
junit = "4.13.2"
postgresql = "42.7.14"
reload4j = "1.2.22"
slf4j = "1.7.36"
xmlunit = "1.6"

[libraries]
commons-collections = { module = "commons-collections:commons-collections", version.ref = "commons-collections" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
commons-logging = { module = "commons-logging:commons-logging", version.ref = "commons-logging" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
json = { module = "org.json:json", version.ref = "json" }
junit = { module = "junit:junit", version.ref = "junit" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
reload4j = { module = "ch.qos.reload4j:reload4j", version.ref = "reload4j" }
slf4j-reload4j = { module = "org.slf4j:slf4j-reload4j", version.ref = "slf4j" }
xmlunit = { module = "xmlunit:xmlunit", version.ref = "xmlunit" }
