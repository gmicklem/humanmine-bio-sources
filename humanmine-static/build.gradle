sourceSets {
    main {
        java {
            srcDirs = ['build/gen']
        }
        resources {
            srcDirs = ['resources']
        }
    }
}

dependencies {
    // no classes: only properties and the model additions, read at run time, so implementation (POM scope runtime)
    implementation group: 'org.intermine', name: 'bio-model', version: bioVersion, transitive: false
}

processResources {
    from('.') { include ("*.properties")}
}
