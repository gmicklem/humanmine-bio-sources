name: HumanMine bio sources CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    services:
      # Label used to access the service container
      postgres:
        image: postgres:11
        # Provide the password for postgres
        env: 
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432/tcp
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    # imVersion and bioVersion in gradle.properties name the InterMine 6.0 line: until it is on Maven Central, publish
    # the maint-2026 branch of intermine/intermine to mavenLocal before this step (see README.md)
    - name: Set up Python 3
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install PostgreSQL client
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libpq-dev postgresql-client
        sudo service postgresql start
    - name: Run unit tests
      run: ./config/init.sh && ./config/run.sh
