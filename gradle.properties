# The InterMine release line these bio sources are built against: the 6.0.0 line. 6.0.+ resolves 6.0.0 from Maven Central once
# it is published; until then it resolves the 6.0.0 that the maint-2026 branch of https://github.com/intermine/intermine
# publishes (publishToMavenLocal) into your local Maven repository (see README.md).
systemProp.imVersion=6.0.+
systemProp.bioVersion=6.0.+

systemProp.javax.xml.stream.XMLOutputFactory = com.sun.xml.internal.stream.XMLOutputFactoryImpl
